[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeit-graph"
version = "0.1.1"
description = "Most knowledge graphs overwrite when facts change. zeit expires the old fact instead, so you can search what's true now and still ask what was true last spring."
readme = "README.md"
authors = [
    { name = "Konstantin Borovik", email = "github@lab5.ca" },
]
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[google]>=2.31.1",
    "pydantic>=2.13",
    "surrealdb>=2.0.0",
    "logfire>=4.40.0",
]

[project.urls]
Homepage = "https://github.com/kborovik/zeit"
Repository = "https://github.com/kborovik/zeit"
Changelog = "https://github.com/kborovik/zeit/blob/main/CHANGELOG.md"
Issues = "https://github.com/kborovik/zeit/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zeit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: live SurrealDB, Gemini, and Logfire",
]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
