[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeit"
version = "0.1.0"
description = "Most knowledge graphs overwrite when facts change. zeit expires the old fact instead, so you can search what's true now and still ask what was true last spring."
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.31.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zeit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
